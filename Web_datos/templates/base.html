<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}REDUX{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='redux.css') }}" rel="stylesheet">
</head>
<body>
    {% if current_user.is_authenticated %}
    <nav class="navbar navbar-dark px-4 py-3">
        <a class="navbar-brand titulo-redux mb-0" href="{{ url_for('paginas.inicio') }}">REDUX</a>
        <div class="d-flex align-items-center gap-3">
            <span class="subtitulo small">{{ current_user.nombre_usuario }} ({{ current_user.rol }})</span>
            <a class="btn btn-sm btn-ver" href="{{ url_for('paginas.salir') }}">Salir</a>
        </div>
    </nav>
    {% endif %}

    <main class="container py-4">
        {% block contenido %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
